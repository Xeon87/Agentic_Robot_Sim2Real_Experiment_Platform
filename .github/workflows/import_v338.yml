name: Import NERO V3.38

on:
  push:
    paths:
      - '.stage_v338/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose staged payload
        shell: bash
        run: |
          set +e
          DEBUG=v338_import_debug.txt
          : > "$DEBUG"
          echo "chunk_count=$(find .stage_v338 -maxdepth 1 -name 'chunk_*.b64' | wc -l)" >> "$DEBUG"
          for f in .stage_v338/chunk_*.b64; do
            echo "FILE $f bytes=$(wc -c < "$f")" >> "$DEBUG"
          done

          cat .stage_v338/chunk_*.b64 | tr -d '\n\r' | base64 -d -i > /tmp/concat.tar.xz 2>>"$DEBUG"
          echo "concat_decode_rc=$? size=$(wc -c < /tmp/concat.tar.xz)" >> "$DEBUG"
          xz -t /tmp/concat.tar.xz >>"$DEBUG" 2>&1
          echo "concat_xz_rc=$?" >> "$DEBUG"

          : > /tmp/each.tar.xz
          for f in .stage_v338/chunk_*.b64; do
            base64 -d -i "$f" >> /tmp/each.tar.xz 2>>"$DEBUG"
            echo "decode $f rc=$? cumulative=$(wc -c < /tmp/each.tar.xz)" >> "$DEBUG"
          done
          xz -t /tmp/each.tar.xz >>"$DEBUG" 2>&1
          echo "each_xz_rc=$? size=$(wc -c < /tmp/each.tar.xz)" >> "$DEBUG"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEBUG"
          git commit -m 'Record NERO V3.38 import diagnostics' || true
          git push origin HEAD:main
