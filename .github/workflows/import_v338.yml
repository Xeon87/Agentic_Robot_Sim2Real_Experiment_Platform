name: Recover NERO V3.38 from original upload

on:
  push:
    paths:
      - '.stage_v338/READY'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate original upload payload
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/chunk_*.b64 | tr -d '\n\r' | base64 -d > /tmp/original_upload.bin
          echo "decoded_size=$(wc -c < /tmp/original_upload.bin)"
          file /tmp/original_upload.bin
          xz -t /tmp/original_upload.bin
          mkdir -p /tmp/nero_v338
          tar -xJf /tmp/original_upload.bin -C /tmp/nero_v338
          echo 'Top-level extracted files:'
          find /tmp/nero_v338 -maxdepth 2 -type f | head -50
      - name: Import recovered project
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/nero_v338/. .
          rm -rf .upload .stage_v338
          rm -f v338_import_debug.txt
          rm -f .github/workflows/import_v338.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Recover and import NERO V3.38 project source'
          git push origin HEAD:main
