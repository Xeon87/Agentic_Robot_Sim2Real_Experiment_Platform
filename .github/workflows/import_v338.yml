name: Export NERO V3.38 staging payload

on:
  push:
    paths:
      - '.stage_v338/READY'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package staging payload
        run: |
          set -euo pipefail
          ls -l .stage_v338
      - uses: actions/upload-artifact@v4
        with:
          name: nero-v338-staging
          path: .stage_v338/chunk_*.b64
          if-no-files-found: error
          compression-level: 0
