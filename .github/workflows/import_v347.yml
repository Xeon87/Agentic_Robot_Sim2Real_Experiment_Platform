name: Import NERO V3.47.1 source

on:
  push:
    paths:
      - '.stage_v347/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and extract payload
        shell: bash
        run: |
          set -euo pipefail
          cat .stage_v347/chunk_*.b64 | tr -d '\n\r' | base64 -d > /tmp/nero_v347.tar.xz
          echo '0f87d854d348d23d61936cf9ba83062dadcfcc25e58543109204c152bd61454f  /tmp/nero_v347.tar.xz' | sha256sum -c -
          xz -t /tmp/nero_v347.tar.xz
          mkdir -p /tmp/nero_v347
          tar -xJf /tmp/nero_v347.tar.xz -C /tmp/nero_v347
          test -f /tmp/nero_v347/VERSION
          test -f /tmp/nero_v347/README.md
          echo "files=$(find /tmp/nero_v347 -type f | wc -l)"
      - name: Replace repository source with V3.47.1
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'LICENSE' -exec rm -rf {} +
          cp -a /tmp/nero_v347/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import NERO V3.47.1 project source'
          git push origin HEAD:main
