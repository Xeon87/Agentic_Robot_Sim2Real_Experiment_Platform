name: Export recovered V3.38 source

on:
  push:
    paths:
      - '.stage_v338/READY'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct V3.38
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/chunk_*.b64 | tr -d '\n\r' | base64 -d > /tmp/v338.tar.xz
          xz -t /tmp/v338.tar.xz
          mkdir -p /tmp/v338
          tar -xJf /tmp/v338.tar.xz -C /tmp/v338
      - uses: actions/upload-artifact@v4
        with:
          name: nero-v338-source
          path: /tmp/v338
          include-hidden-files: true
